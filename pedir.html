// La app de Utopía Coffee Club ahora está en https://utopiacoffeeclub.github.io/
(function(){
  var p = location.pathname.replace(/^\/utopia-comandas\/?/, "");
  if (!p || p === "/") p = "pedir.html";
  var url = "https://utopiacoffeeclub.github.io/" + p + location.search + location.hash;
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(x){ x.unregister(); }); }); } catch(e){}
  location.replace(url);
})();
</script>
